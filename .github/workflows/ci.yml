name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      # Pinned to a full commit SHA, never a tag: a tag is mutable, so `@v7`
      # means "whatever that name points at when the job runs".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install shellcheck
        run: brew install shellcheck

      # install.sh is the only shell left: it is the curl | sh bootstrap, so it
      # runs before there is a binary to run anything else with.
      - name: Lint the installer
        run: shellcheck -x --source-path=SCRIPTDIR install.sh

      - name: Typecheck the panel
        run: pnpm typecheck

      # dist/ is generated rather than committed, so the tests that read the
      # artifact need it built first.
      - name: Build the panel
        run: pnpm build

      # A release attaches this artifact, so two builds of the same source must
      # produce the same bytes and none of them may name a build machine.
      - name: Check the build is reproducible
        run: pnpm verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the binary
        run: cargo build --release

      - name: Test
        run: cargo test --all
