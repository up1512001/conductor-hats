[package]
name = "hats"
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
description = "Run any number of Claude Code or Codex accounts in Conductor, one per workspace"
license = "MIT"
repository = "https://github.com/up1512001/conductor-hats"
default-run = "hats"

[[bin]]
name = "hats"
path = "src/rust/main.rs"

[dependencies]
# Pure Rust, so the binary needs no C toolchain and cross-compiles cleanly.
brotli = "8.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
serde_json = "1.0.151"
